name: Build And Stage Release Artifacts
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
jobs:
  build-artifacts:
    uses: ./.github/workflows/release-build-artifacts.yml
    secrets: inherit
  stage-artifacts:
    needs: build-artifacts
    permissions:
      contents: write
    uses: ./.github/workflows/release-deploy-to-staging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit