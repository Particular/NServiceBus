name: Build Artifacts
on:
  workflow_call:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
defaults:
  run:
    shell: pwsh
jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src --configuration Release
      - name: Sign NuGet packages
        uses: Particular/sign-nuget-packages-action@v1.0.0
        with:
          client-id: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          certificate-name: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE_NAME }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nugets
          path: nugets/*
          retention-days: 1
      - name: Push packages to testing feed
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: dotnet nuget push nugets\*.nupkg --api-key ${{ secrets.FEEDZIO_PUBLISH_API_KEY }} --source "${{ vars.PARTICULAR_TESTING_FEED_URL }}"
      - name: Attach artifacts to release
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: particular/deployment-workflows/.github/actions/create-draft-release-with-assets@1.0.0
        with:
          asset-paths: "nugets/"
