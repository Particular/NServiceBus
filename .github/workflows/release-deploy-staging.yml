name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
env:
  DOTNET_NOLOGO: true
jobs:
  check-authorized-user:
    uses: Particular/deployment-workflows/.github/workflows/verify-authorized-user.yml@1.0.0
  push-nuget-packages-staging:
    needs: check-authorized-user
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Push NuGet packages
        uses: Particular/deployment-workflows/.github/actions/push-nuget-packages@1.0.0
        with:
          version: ${{ inputs.version }}
          deploy-environment: staging
          api-key: ${{ secrets.FEEDZIO_PUBLISH_API_KEY }}
  generate-release-notes:
    needs: check-authorized-user
    uses: Particular/deployment-workflows/.github/workflows/generate-release-notes.yml@1.0.0
    with:
      version: ${{ inputs.version }}
    secrets: inherit
